# Picked up by the Grafana sidecar configured in
# kube-prometheus-stack-values.yaml (sidecar.dashboards, searchNamespace:
# ALL) via the grafana_dashboard label -- no manual import needed. Apply
# after installing kube-prometheus-stack, same as app-servicemonitor.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulse-grafana-dashboard
  namespace: pulse
  labels:
    grafana_dashboard: "1"
data:
  pulse-platform.json: |
    {
      "title": "pulse-platform",
      "uid": "pulse-platform",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Request rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(pulse_http_requests_total[5m])) by (method, path)",
              "legendFormat": "{{method}} {{path}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Error rate (5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(pulse_http_requests_total{status=~\"5..\"}[5m])) by (path)",
              "legendFormat": "{{path}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "p95 latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(pulse_http_request_duration_seconds_bucket[5m])) by (le, path))",
              "legendFormat": "{{path}}"
            }
          ]
        }
      ]
    }
