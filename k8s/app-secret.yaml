# Dev-only: plaintext credentials checked into git are fine for a local kind
# cluster using the same throwaway pulse/pulse creds as docker-compose. A
# real deployment would generate this from a secret store (Sealed Secrets,
# External Secrets Operator, cloud KMS) instead of committing it.
apiVersion: v1
kind: Secret
metadata:
  name: pulse-app-secrets
  namespace: pulse
type: Opaque
stringData:
  PULSE_DATABASE_URL: "postgresql+asyncpg://pulse:pulse@postgres:5432/pulse"
  PULSE_REDIS_URL: "redis://redis:6379/0"
