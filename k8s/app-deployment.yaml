apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-app
  namespace: pulse
  labels:
    app.kubernetes.io/name: pulse-app
    app.kubernetes.io/part-of: pulse-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-app
    spec:
      containers:
        - name: app
          image: pulse-platform:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PULSE_ENVIRONMENT
              value: "development"
            - name: PULSE_DATABASE_URL
              value: "postgresql+asyncpg://pulse:pulse@postgres:5432/pulse"
            - name: PULSE_REDIS_URL
              value: "redis://redis:6379/0"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
