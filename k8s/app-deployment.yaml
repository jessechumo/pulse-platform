apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-app
  namespace: pulse
  labels:
    app.kubernetes.io/name: pulse-app
    app.kubernetes.io/part-of: pulse-platform
spec:
  # No replicas field: the HorizontalPodAutoscaler owns this field once it
  # exists, and a hardcoded value here would just fight it on every apply.
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-app
    spec:
      containers:
        - name: app
          image: pulse-platform:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulse-app-config
            - secretRef:
                name: pulse-app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
