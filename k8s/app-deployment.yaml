apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-app
  namespace: pulse
  labels:
    app.kubernetes.io/name: pulse-app
    app.kubernetes.io/part-of: pulse-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-app
    spec:
      containers:
        - name: app
          image: pulse-platform:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pulse-app-config
            - secretRef:
                name: pulse-app-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
