apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-worker
  namespace: pulse
  labels:
    app.kubernetes.io/name: pulse-worker
    app.kubernetes.io/part-of: pulse-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-worker
    spec:
      containers:
        - name: worker
          image: pulse-platform:dev
          imagePullPolicy: IfNotPresent
          command: ["arq", "app.worker.WorkerSettings"]
          env:
            - name: PULSE_ENVIRONMENT
              value: "development"
            - name: PULSE_DATABASE_URL
              value: "postgresql+asyncpg://pulse:pulse@postgres:5432/pulse"
            - name: PULSE_REDIS_URL
              value: "redis://redis:6379/0"
