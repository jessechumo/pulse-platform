apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-worker
  namespace: pulse
  labels:
    app.kubernetes.io/name: pulse-worker
    app.kubernetes.io/part-of: pulse-platform
spec:
  # No replicas field: owned by the HorizontalPodAutoscaler, same as pulse-app.
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-worker
    spec:
      containers:
        - name: worker
          image: pulse-platform:dev
          imagePullPolicy: IfNotPresent
          command: ["arq", "app.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: pulse-app-config
            - secretRef:
                name: pulse-app-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
