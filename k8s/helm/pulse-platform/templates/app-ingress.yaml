apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulse-app
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulse-app
                port:
                  number: 80
