apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulse-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: pulse-worker
    {{- include "pulse-platform.labels" . | nindent 4 }}
spec:
  # No replicas field: owned by the HorizontalPodAutoscaler, same as pulse-app.
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["arq", "app.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: pulse-app-config
            - secretRef:
                name: pulse-app-secrets
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
